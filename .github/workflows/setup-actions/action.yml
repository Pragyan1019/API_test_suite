name: Setup Application 
description: Checkout code and install node with required dependencies

inputs:
  node-version:
    description: 'Node.js version to use'
    default: '20'

runs:
  using: composite
  steps:
  - name: Checkout
    uses: action/checkout@v4
    shell: bash
  
  - name: Setup node
    uses: action/setup-node@v4
    with:
      version: '${{ input.node-version }}'
      cache: npm

  - name: install dependencies
    run: npm install playwright@latest
    shell: bash
